<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- All visible copy comes from /locales/content.json via content.js -->
    <header class="site-header">
      <div class="header-wrap">
        <div class="header-inner">
          <div class="header-left">
            <h1 class="site-title">
              <a href="/" aria-current="page" data-content="meta.siteTitle"></a>
            </h1>
          </div>

          <div class="header-right">
            <div class="header-phone-box">
              <div class="header-phone-inner">
                <p class="top-phone-text" data-content="location.label"></p>
                <p class="top-phone-num">
                  <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-content="location.address"
                    data-content-attr="href:location.mapsHref"
                  ></a>
                </p>
              </div>
            </div>

            <nav
              class="primary-nav"
              id="primary-nav"
              data-content-attr="aria-label:nav.ariaLabel"
            >
              <button
                class="nav-toggle"
                id="nav-toggle"
                type="button"
                aria-controls="nav-menu"
                aria-expanded="false"
                data-content-attr="aria-label:nav.openMenu"
              >
                <span class="nav-toggle-bar" aria-hidden="true"></span>
                <span class="nav-toggle-bar" aria-hidden="true"></span>
                <span class="nav-toggle-bar" aria-hidden="true"></span>
              </button>

              <div class="nav-overlay" id="nav-overlay" hidden></div>

              <div class="nav-drawer" id="nav-menu">
                <button
                  class="nav-close"
                  id="nav-close"
                  type="button"
                  data-content-attr="aria-label:nav.closeMenu"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    width="24"
                    height="24"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      d="m13.06 12 6.47-6.47-1.06-1.06L12 10.94 5.53 4.47 4.47 5.53 10.94 12l-6.47 6.47 1.06 1.06L12 13.06l6.47 6.47 1.06-1.06L13.06 12Z"
                    />
                  </svg>
                </button>

                <div class="nav-drawer-phone">
                  <p data-content="location.label"></p>
                  <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-content="location.address"
                    data-content-attr="href:location.mapsHref"
                  ></a>
                </div>

                <!-- Populated from content.nav.items -->
                <ul class="nav-list" data-content-list="nav.items"></ul>
              </div>
            </nav>

            <div class="header-actions">
              <form class="top-search" role="search" action="/" method="get">
                <label
                  class="visually-hidden"
                  for="site-search"
                  data-content="search.label"
                ></label>
                <div class="search-inner">
                  <input
                    id="site-search"
                    class="search-input"
                    type="search"
                    name="s"
                    data-content-attr="placeholder:search.placeholder"
                    aria-hidden="true"
                    tabindex="-1"
                  />
                  <button
                    class="search-toggle"
                    id="search-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="site-search"
                    data-content-attr="aria-label:search.expand"
                  >
                    <svg
                      class="search-icon"
                      viewBox="0 0 24 24"
                      width="24"
                      height="24"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path
                        d="M13 5c-3.3 0-6 2.7-6 6 0 1.4.5 2.7 1.3 3.7l-3.8 3.8 1.1 1.1 3.8-3.8c1 .8 2.3 1.3 3.7 1.3 3.3 0 6-2.7 6-6S16.3 5 13 5zm0 10.5c-2.5 0-4.5-2-4.5-4.5s2-4.5 4.5-4.5 4.5 2 4.5 4.5-2 4.5-4.5 4.5z"
                      />
                    </svg>
                  </button>
                </div>
              </form>

              <a
                class="appointment-btn"
                href="#"
                data-content-attr="href:actions.appointment.href"
              >
                <span class="appointment-icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="currentColor"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM8 12h8v1.5H8V12zm0 3.5h8V17H8v-1.5zm0-7h4V10H8V8.5z"
                    />
                  </svg>
                </span>
                <span
                  class="appointment-label"
                  data-content="actions.appointment.label"
                ></span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="site-main">
      <section class="hero-section" aria-labelledby="hero-heading">
        <div class="hero-wrap">
          <img
            class="hero-bg"
            src="/images/banner-img.png"
            alt=""
            data-content-attr="alt:hero.imageAlt"
            width="1600"
            height="900"
          />
          <div class="hero-overlay" aria-hidden="true"></div>

          <img
            class="hero-chevron hero-chevron--left"
            src="/images/banner-design1.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="hero-chevron hero-chevron--right"
            src="/images/banner-design2.png"
            alt=""
            aria-hidden="true"
          />

          <div class="hero-content">
            <p class="hero-welcome" data-content="hero.welcome"></p>
            <h2 class="hero-heading" id="hero-heading">
              <mark data-content="hero.headingHighlight"></mark
              ><span data-content="hero.headingRest"></span>
            </h2>
            <p class="hero-subheading" data-content="hero.subheading"></p>
            <ul
              class="hero-schedule"
              data-content-attr="aria-label:hero.scheduleAria"
            >
              <li data-content="hero.scheduleTue"></li>
              <li data-content="hero.scheduleThu"></li>
            </ul>
            <a
              class="hero-cta"
              href="#"
              data-content="hero.cta.label"
              data-content-attr="href:hero.cta.href"
            ></a>
          </div>
        </div>
      </section>

      <section class="services-section" id="services-section">
        <!-- Populated from home.json → services.items -->
        <div
          class="service-boxes"
          data-content-list="services.items"
        ></div>
      </section>

      <!-- Bemutatkozás (from lovable design) -->
      <section class="about-section" id="rolunk">
        <div class="about-section__inner">
          <div class="about-photo">
            <div class="about-photo__frame">
              <img
                class="about-photo__img"
                src="/images/instructor-profile-professional.jpg"
                alt=""
                width="800"
                height="1000"
                data-content-attr="alt:about.photoAlt"
              />
            </div>
            <div class="about-badge">
              <p data-content="about.badgeLabel"></p>
              <strong data-content="about.badgeName"></strong>
            </div>
          </div>

          <div class="about-copy">
            <div class="section-eyebrow">
              <p data-content="about.eyebrow"></p>
              <span class="section-eyebrow__line" aria-hidden="true"></span>
            </div>
            <h2 class="about-heading">
              <span data-content="about.headingBefore"></span
              ><mark data-content="about.headingHighlight"></mark
              ><span data-content="about.headingAfter"></span>
            </h2>
            <div
              class="about-paragraphs"
              data-content-list="about.paragraphs"
            ></div>
            <div class="about-stats" data-content-list="about.stats"></div>
            <a
              class="about-cta"
              href="/foglalas"
              data-content-attr="href:about.cta.href"
            >
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                aria-hidden="true"
              >
                <path
                  d="M8 2v4M16 2v4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <rect
                  width="18"
                  height="18"
                  x="3"
                  y="4"
                  rx="2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M3 10h18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <span data-content="about.cta.label"></span>
            </a>
          </div>
        </div>
      </section>

      <!-- Galéria (from lovable design) -->
      <section class="gallery-section" id="galeria">
        <div class="gallery-section__inner">
          <div class="gallery-header">
            <div>
              <div class="section-eyebrow">
                <p data-content="gallery.eyebrow"></p>
                <span class="section-eyebrow__line" aria-hidden="true"></span>
              </div>
              <h2 class="gallery-heading" data-content="gallery.heading"></h2>
            </div>
            <p class="gallery-intro" data-content="gallery.intro"></p>
          </div>
          <div
            class="gallery-grid"
            id="gallery-grid"
            data-content-list="gallery.items"
          ></div>
          <div class="gallery-actions">
            <button
              type="button"
              class="gallery-cta"
              id="gallery-more-btn"
              data-content="gallery.cta.label"
              aria-expanded="false"
              aria-controls="gallery-grid"
            ></button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__glow" aria-hidden="true"></div>
      <div class="site-footer__inner">
        <div class="site-footer__brand">
          <a class="site-footer__title" href="/" data-content="meta.siteTitle"></a>
          <p class="site-footer__tagline" data-content="footer.tagline"></p>
        </div>

        <nav
          class="site-footer__nav"
          data-content-attr="aria-label:footer.navAriaLabel"
        >
          <ul class="site-footer__links" data-content-list="nav.items"></ul>
        </nav>

        <div class="site-footer__aside">
          <p class="site-footer__label" data-content="footer.locationHeading"></p>
          <a
            class="site-footer__address"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            data-content="location.address"
            data-content-attr="href:location.mapsHref"
          ></a>
          <a
            class="site-footer__cta"
            href="#"
            data-content="actions.appointment.label"
            data-content-attr="href:actions.appointment.href"
          ></a>
        </div>
      </div>

      <div class="site-footer__bottom">
        <p>
          © <span id="site-year"></span>
          <span data-content="meta.siteTitle"></span>
          ·
          <span data-content="footer.copyrightSuffix"></span>
        </p>
      </div>
    </footer>

    <script src="/js/content.js" defer></script>
    <script src="/js/nav.js" defer></script>
  </body>
</html>
